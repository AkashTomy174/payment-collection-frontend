name: Frontend CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run lint

  eas-android-preview:
    needs: test
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      API_URL: ${{ secrets.API_URL }}
    steps:
      - name: Checkout
        if: env.EXPO_TOKEN != ''
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.EXPO_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        if: env.EXPO_TOKEN != ''
        run: npm ci

      - name: Build Android preview
        if: env.EXPO_TOKEN != ''
        run: eas build --platform android --profile preview --non-interactive

      - name: Skip EAS build
        if: env.EXPO_TOKEN == ''
        run: echo "EXPO_TOKEN is not configured; type-check completed and EAS build was skipped."
